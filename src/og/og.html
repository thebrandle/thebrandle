<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,700..800&family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* The share image: the home page hero in one 1200x630 frame. Rendered by og.mjs. */
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #f8eee8; font-family: "Geist", sans-serif; position: relative; }
  .logo { position: absolute; left: 44px; top: 36px; width: 150px; }
  .url { position: absolute; right: 48px; top: 50px; font-size: 20px; font-weight: 500; }
  h1 { position: absolute; left: 0; right: 0; top: 96px; text-align: center; font: 800 132px/0.8 "Bricolage Grotesque", sans-serif; font-stretch: 75%; text-transform: uppercase; color: #f9452d; }
  .pill { position: absolute; padding: 9px 22px; border-radius: 100px; background: #000; color: #fdf8f5; font-size: 19px; font-weight: 500; }
  .p1 { left: 232px; top: 150px; rotate: -5deg; }
  .p2 { right: 236px; top: 262px; rotate: 4deg; }
  .stage { position: absolute; left: 50%; bottom: -8px; width: 760px; translate: -50% 0; aspect-ratio: 2200 / 1092; mix-blend-mode: multiply; }
  .stage img, .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage img { filter: brightness(1.06); } /* same lift as the site: no box where the picture multiplies onto the page */
  .stage text { font: 800 100px "Bricolage Grotesque", sans-serif; font-stretch: 75%; fill: #f9452d; text-anchor: middle; }
  .arc { position: absolute; fill: none; stroke: #f9452d; stroke-width: 26; stroke-linecap: round; }
</style>
</head>
<body>
  <svg class="arc" style="left:-70px; bottom:-120px; width:330px; height:420px" viewBox="0 0 229 599"><path d="M-60 40C70 30 190 110 190 240S70 420 10 340S60 170 150 250S215 480 -40 590"/></svg>
  <svg class="arc" style="right:-110px; bottom:-90px; width:420px; height:400px" viewBox="0 0 354 487"><path d="M400 10C250 20 110 110 125 240S270 430 335 330S270 140 185 205S90 430 420 480"/></svg>
  <img class="logo" src="http://localhost:4660/assets/logo-sticker.svg" alt="">
  <p class="url">thebrandle.com</p>
  <h1>Annoyingly<br>good at design</h1>
  <span class="pill p1">Dubai design studio</span>
  <span class="pill p2">Humble, too</span>
  <div class="stage">
    <img src="http://localhost:4660/assets/hero-poster.webp" alt="">
    <svg viewBox="0 0 2200 1092">
      <g transform="translate(941.4 292.9) rotate(-0.82)"><text id="t1">YES,</text></g>
      <g transform="translate(1403.9 445.7) rotate(0.59)"><text id="t2">CAMELS</text></g>
    </svg>
  </div>
<script>
  // same fitting rule as the live boards on the home page
  document.fonts.ready.then(() => {
    [['t1', 219.2, 114.4, 1.15], ['t2', 527.5, 122.2, 1]].forEach(([id, w, h, room]) => {
      const t = document.getElementById(id);
      t.style.fontSize = '100px';
      const fs = Math.min(h / 0.7, 100 * w * room / t.getComputedTextLength());
      t.style.fontSize = fs + 'px'; t.setAttribute('y', fs * 0.7 / 2);
    });
    document.body.dataset.ready = '1';
  });
</script>
</body>
</html>
